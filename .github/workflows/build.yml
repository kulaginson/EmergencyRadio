name: Build EmergencyRadio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -A Win32
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Show files
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.asi" |
            Select-Object FullName, Length

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: EmergencyRadio
          path: build/**/EmergencyRadio.asi
          if-no-files-found: error
